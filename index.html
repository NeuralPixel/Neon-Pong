<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>NEON PONG</title>
    <style>
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 500px;
            border: 4px solid #00ffff;
            background-color: #000;
            box-shadow: 0 0 25px #00ffff;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        h1 {
            font-size: 64px;
            margin: 0 0 20px 0;
            letter-spacing: 8px;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
        }
        .menu-btn {
            background-color: #000;
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 12px 30px;
            font-size: 20px;
            font-family: inherit;
            cursor: pointer;
            margin: 12px;
            width: 380px;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
            transition: all 0.2s ease;
        }
        .menu-btn:hover {
            background-color: #00ffff;
            color: #000;
            text-shadow: none;
            box-shadow: 0 0 20px #00ffff;
        }
        #btn-activate {
            border-color: #ff00ff;
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.2);
        }
        #btn-activate:hover {
            background-color: #ff00ff;
            color: #000;
            box-shadow: 0 0 20px #ff00ff;
        }
        .setting-row {
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 450px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }
        .setting-row input[type="number"] {
            background: none;
            border: 2px solid #ff00ff;
            color: #ff00ff;
            font-family: inherit;
            font-size: 18px;
            padding: 5px;
            width: 70px;
            text-align: center;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
        }
        .setting-row input[type="range"] {
            width: 150px;
            accent-color: #00ffff;
            cursor: pointer;
        }
        .setting-row input[type="color"] {
            border: 2px solid #00ffff;
            background: none;
            width: 50px;
            height: 35px;
            cursor: pointer;
            padding: 0;
        }
        #score-display {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 48px;
            letter-spacing: 20px;
            pointer-events: none;
            display: none;
            z-index: 5;
            text-shadow: 0 0 10px #00ffff;
        }
        canvas {
            display: none;
            background-color: #000;
        }
        .controls-info {
            margin-top: 15px;
            display: flex;
            gap: 40px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="score-display">0 : 0</div>

        <!-- СТАРТОВАЯ КНОПКА ВКЛЮЧЕНИЯ -->
        <div id="activate-screen" class="screen">
            <h1></h1>
            <button class="menu-btn" id="btn-activate">ВКЛЮЧИТЬ ИГРОВОЙ АВТОМАТ</button>
        </div>

        <!-- ГЛАВНОЕ МЕНЮ -->
        <div id="main-menu" class="screen" style="display: none;">
            <h1>NEON PONG</h1>
            <button class="menu-btn" id="btn-start">СТАРТ ИГРЫ</button>
            <button class="menu-btn" id="btn-settings">НАСТРОЙКИ</button>
        </div>

        <!-- НАСТРОЙКИ -->
        <div id="settings-menu" class="screen" style="display: none;">
            <h1>НАСТРОЙКИ</h1>
            
            <div class="setting-row">
                <span>Играть до (очков):</span>
                <input type="number" id="max-score-input" value="5" min="1" max="99">
            </div>
            
            <div class="setting-row">
                <span>Громкость музыки:</span>
                <input type="range" id="music-volume" min="0" max="100" value="50">
            </div>
            
            <div class="setting-row">
                <span>Громкость эффектов:</span>
                <input type="range" id="sfx-volume" min="0" max="100" value="50">
            </div>

            <div class="setting-row">
                <span>Цвет Игрока 1 (Левый):</span>
                <input type="color" id="color-p1" value="#00ffff">
            </div>

            <div class="setting-row">
                <span>Цвет Игрока 2 (Правый):</span>
                <input type="color" id="color-p2" value="#ff00ff">
            </div>

            <button class="menu-btn" id="btn-back">НАЗАД</button>
        </div>

        <!-- КОНЕЦ ИГРЫ -->
        <div id="game-over-menu" class="screen" style="display: none;">
            <h1 id="winner-text">ПОБЕДА!</h1>
            <button class="menu-btn" id="btn-to-menu">В МЕНЮ</button>
        </div>

        <canvas id="pong" width="800" height="500"></canvas>
    </div>

    <div class="controls-info">
        <div>Левый игрок: <b>W / S</b></div>
        <div>Правый игрок: <b>▲ / ▼</b></div>
    </div>

<script>

// Part 2

const canvas = document.getElementById('pong');
const context = canvas.getContext('2d');
const scoreDisplay = document.getElementById('score-display');

const scrActivate = document.getElementById('activate-screen');
const scrMenu = document.getElementById('main-menu');
const scrSettings = document.getElementById('settings-menu');
const scrGameOver = document.getElementById('game-over-menu');
const winnerText = document.getElementById('winner-text');
const maxScoreInput = document.getElementById('max-score-input');

// Элементы управления громкостью и цветом
const musicVolInput = document.getElementById('music-volume');
const sfxVolInput = document.getElementById('sfx-volume');
const colorP1Input = document.getElementById('color-p1');
const colorP2Input = document.getElementById('color-p2');

let gameState = 'activate'; 
let maxScore = 5;

// Цвета игроков
let paddle1Color = '#00ffff';
let paddle2Color = '#ff00ff';

// ЗВУКОВОЙ ДВИЖОК
let audioCtx = null;
let musicInterval = null;

// ИСПРАВЛЕННАЯ ПОЛИФОНИЧЕСКАЯ МАТРИЦА (Голос 1: Бас, Голос 2: Мелодия)
// 0 означает музыкальную паузу
const polyMelody = [
    // === КУПЛЕТ (Часть А: Вступление и главный мотив) ===
    [ 130.81, 261.63 ], [ 0,      329.63 ], [ 130.81, 392.00 ], [ 0,      523.25 ],
    [ 146.83, 293.66 ], [ 0,      349.23 ], [ 146.83, 440.00 ], [ 0,      587.33 ],
    [ 164.81, 329.63 ], [ 0,      392.00 ], [ 164.81, 493.88 ], [ 0,      659.25 ],
    [ 174.61, 349.23 ], [ 0,      440.00 ], [ 196.00, 392.00 ], [ 0,      0      ],

    // === РАЗВИТИЕ КУПЛЕТА (Часть А2: Мелодия усложняется) ===
    [ 130.81, 523.25 ], [ 0,      493.88 ], [ 130.81, 440.00 ], [ 0,      392.00 ],
    [ 146.83, 440.00 ], [ 0,      392.00 ], [ 146.83, 349.23 ], [ 0,      293.66 ],
    [ 164.81, 329.63 ], [ 0,      392.00 ], [ 164.81, 493.88 ], [ 0,      587.33 ],
    [ 196.00, 523.25 ], [ 0,      587.33 ], [ 196.00, 659.25 ], [ 0,      783.99 ],

    // === ПРИПЕВ (Часть Б: Энергичный мажорный взрыв) ===
    [ 130.81, 523.25 ], [ 130.81, 659.25 ], [ 0,      587.33 ], [ 130.81, 523.25 ],
    [ 174.61, 440.00 ], [ 174.61, 523.25 ], [ 0,      698.46 ], [ 174.61, 587.33 ],
    [ 196.00, 392.00 ], [ 196.00, 493.88 ], [ 0,      587.33 ], [ 196.00, 523.25 ],
    [ 164.81, 493.88 ], [ 164.81, 587.33 ], [ 0,      659.25 ], [ 0,      0      ],

    // === ФИНАЛ ПРИПЕВА (Часть Б2: Торжественный спуск и выход на петлю) ===
    [ 130.81, 523.25 ], [ 0,      587.33 ], [ 146.83, 659.25 ], [ 0,      587.33 ],
    [ 174.61, 523.25 ], [ 0,      493.88 ], [ 196.00, 440.00 ], [ 0,      392.00 ],
    [ 130.81, 349.23 ], [ 0,      329.63 ], [ 146.83, 293.66 ], [ 0,      261.63 ],
    [ 196.00, 196.00 ], [ 0,      246.94 ], [ 196.00, 293.66 ], [ 0,      0      ]
];
let step = 0;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playTone(frequency, duration, type = 'square', volume = 0.04) {
    if (frequency === 0) return;
    initAudio();
    try {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

// Запуск полифонической музыки (темп замедлен до 240мс на шаг)
function startIntroMusic() {
    if (musicInterval) clearInterval(musicInterval);
    step = 0;
    musicInterval = setInterval(() => {
        if (gameState === 'menu' || gameState === 'settings') {
            let baseVol = (parseInt(musicVolInput.value) / 100) * 0.15;
            
            let currentNotes = polyMelody[step % polyMelody.length];
            let bassNote = currentNotes[0];
            let leadNote = currentNotes[1];

            // Канал 1: Глубокий бас (sawtooth)
            if (bassNote > 0) {
                playTone(bassNote, 0.35, 'sawtooth', baseVol * 0.6);
            }
            // Канал 2: Мягкое соло (triangle)
            if (leadNote > 0) {
                playTone(leadNote, 0.22, 'triangle', baseVol * 0.8);
            }
            
            step++;
        } else {
            clearInterval(musicInterval);
            musicInterval = null;
        }
    }, 240);
}

function playMenuClick() {
    let currentSfxVol = (parseInt(sfxVolInput.value) / 100) * 0.25;
    playTone(523.25, 0.08, 'triangle', currentSfxVol);
    setTimeout(() => playTone(659.25, 0.12, 'triangle', currentSfxVol), 60);
}

// ОБРАБОТЧИКИ КНОПОК
document.getElementById('btn-activate').addEventListener('click', () => {
    initAudio(); 
    gameState = 'menu';
    scrActivate.style.display = 'none';
    scrMenu.style.display = 'flex';
    
    playMenuClick();
    startIntroMusic(); 
});

document.getElementById('btn-start').addEventListener('click', () => {
    maxScore = parseInt(maxScoreInput.value) || 5;
    paddle1Color = colorP1Input.value;
    paddle2Color = colorP2Input.value;
    
    playMenuClick();
    if (musicInterval) clearInterval(musicInterval);
    
    gameState = 'playing';

    scrMenu.style.display = 'none';
    canvas.style.display = 'block';
    scoreDisplay.style.display = 'block';
    scoreDisplay.innerText = "0 : 0";

    leftPaddle.score = 0;
    rightPaddle.score = 0;
    leftPaddle.height = 100;
    rightPaddle.height = 100;
    leftPaddle.y = canvas.height / 2 - leftPaddle.height / 2;
    rightPaddle.y = canvas.height / 2 - rightPaddle.height / 2;
    
    resetBall();
});

document.getElementById('btn-settings').addEventListener('click', () => {
    playMenuClick();
    gameState = 'settings';
    scrMenu.style.display = 'none';
    scrSettings.style.display = 'flex';
});

document.getElementById('btn-back').addEventListener('click', () => {
    paddle1Color = colorP1Input.value;
    paddle2Color = colorP2Input.value;
    
    playMenuClick();
    gameState = 'menu';
    scrSettings.style.display = 'none';
    scrMenu.style.display = 'flex';
});

document.getElementById('btn-to-menu').addEventListener('click', () => {
    playMenuClick();
    gameState = 'menu';
    scrGameOver.style.display = 'none';
    scrMenu.style.display = 'flex';
    startIntroMusic();
});

// Part 3

// Параметры игровых объектов (высота задается внутри объектов)
const paddleWidth = 12;
const paddleSpeed = 7;
const ballRadius = 8;

let leftPaddle = { x: 20, y: 200, height: 100, score: 0 };
let rightPaddle = { x: 768, y: 200, height: 100, score: 0 };
let ball = { x: 400, y: 250, speedX: 5, speedY: 3, speedIncrement: 1.05 };

// Отслеживание клавиатуры
const keys = {};
window.addEventListener('keydown', (e) => keys[e.code] = true);
window.addEventListener('keyup', (e) => keys[e.code] = false);

function resetBall() {
    ball.x = canvas.width / 2;
    ball.y = canvas.height / 2;
    ball.speedX = ball.speedX > 0 ? -5 : 5;
    // Безопасный начальный угол
    ball.speedY = (Math.random() > 0.5 ? 2.5 : -2.5) + (Math.random() - 0.5);
}

function checkCollision(b, p) {
    return b.x + ballRadius > p.x &&
           b.x - ballRadius < p.x + paddleWidth &&
           b.y + ballRadius > p.y &&
           b.y - ballRadius < p.y + p.height;
}

// Торжественный победный марш из ретро-нот
function playVictoryMarch(currentSfxVol) {
    try {
        playTone(523.25, 0.15, 'square', currentSfxVol); // До
        setTimeout(() => playTone(523.25, 0.15, 'square', currentSfxVol), 150);
        setTimeout(() => playTone(523.25, 0.15, 'square', currentSfxVol), 300);
        setTimeout(() => playTone(523.25, 0.4, 'square', currentSfxVol), 450); // Длинная До
        setTimeout(() => playTone(415.30, 0.3, 'square', currentSfxVol), 850); // Ля-диез
        setTimeout(() => playTone(466.16, 0.3, 'square', currentSfxVol), 1150); // Си-диез
        setTimeout(() => playTone(523.25, 0.6, 'square', currentSfxVol), 1450); // Финальная До
    } catch(e) {}
}

function update() {
    if (gameState !== 'playing') return;

    let currentSfxVol = (parseInt(sfxVolInput.value) / 100) * 0.25;
    
    let leftPaddleDir = 0;
    let rightPaddleDir = 0;

    // Движение левой ракетки (W / S)
    if (keys['KeyW'] && leftPaddle.y > 0) {
        leftPaddle.y -= paddleSpeed;
        leftPaddleDir = -1;
    }
    if (keys['KeyS'] && leftPaddle.y < canvas.height - leftPaddle.height) {
        leftPaddle.y += paddleSpeed;
        leftPaddleDir = 1;
    }

    // Движение правой ракетки (Стрелки ▲ / ▼)
    if (keys['ArrowUp'] && rightPaddle.y > 0) {
        rightPaddle.y -= paddleSpeed;
        rightPaddleDir = -1;
    }
    if (keys['ArrowDown'] && rightPaddle.y < canvas.height - rightPaddle.height) {
        rightPaddle.y += paddleSpeed;
        rightPaddleDir = 1;
    }

    // Движение мяча
    ball.x += ball.speedX;
    ball.y += ball.speedY;

    // Жесткая фиксация границ поля (Защита от вылета мяча)
    if (ball.y - ballRadius < 0) {
        ball.y = ballRadius; 
        ball.speedY = Math.abs(ball.speedY); 
        playTone(240, 0.08, 'square', currentSfxVol * 0.8);
    } else if (ball.y + ballRadius > canvas.height) {
        ball.y = canvas.height - ballRadius; 
        ball.speedY = -Math.abs(ball.speedY); 
        playTone(240, 0.08, 'square', currentSfxVol * 0.8);
    }

    // Столкновение с левой ракеткой
    if (checkCollision(ball, leftPaddle)) {
        ball.x = leftPaddle.x + paddleWidth + ballRadius;
        ball.speedX = Math.abs(ball.speedX) * ball.speedIncrement;
        
        let diff = ball.y - (leftPaddle.y + leftPaddle.height / 2);
        ball.speedY = diff * 0.12;
        ball.speedY += leftPaddleDir * 1.5; // Подкрутка

        if (Math.abs(ball.speedY) < 0.5) {
            ball.speedY = (Math.random() > 0.5 ? 1 : -1);
        }

        playTone(450, 0.1, 'square', currentSfxVol);
    }
    
    // Столкновение с правой ракеткой
    if (checkCollision(ball, rightPaddle)) {
        ball.x = rightPaddle.x - ballRadius;
        ball.speedX = -Math.abs(ball.speedX) * ball.speedIncrement;
        
        let diff = ball.y - (rightPaddle.y + rightPaddle.height / 2);
        ball.speedY = diff * 0.12;
        ball.speedY += rightPaddleDir * 1.5; // Подкрутка

        if (Math.abs(ball.speedY) < 0.5) {
            ball.speedY = (Math.random() > 0.5 ? 1 : -1);
        }

        playTone(450, 0.1, 'square', currentSfxVol);
    }

    // Гол правому игроку
    if (ball.x - ballRadius < 0) {
        rightPaddle.score++;
        scoreDisplay.innerText = `${leftPaddle.score} : ${rightPaddle.score}`;
        playTone(130, 0.35, 'sawtooth', currentSfxVol * 1.2);
        
        leftPaddle.height = Math.max(40, leftPaddle.height - 15);
        rightPaddle.height = Math.min(200, rightPaddle.height + 15);

        if (rightPaddle.score >= maxScore) {
            gameState = 'gameover';
            canvas.style.display = 'none';
            scoreDisplay.style.display = 'none';
            scrGameOver.style.display = 'flex';
            winnerText.innerText = 'ПРАВЫЙ ВЫИГРАЛ!';
            playVictoryMarch(currentSfxVol);
        } else {
            resetBall();
        }
    } 
    // Гол левому игроку
    else if (ball.x + ballRadius > canvas.width) {
        leftPaddle.score++;
        scoreDisplay.innerText = `${leftPaddle.score} : ${rightPaddle.score}`;
        playTone(130, 0.35, 'sawtooth', currentSfxVol * 1.2);
        
        rightPaddle.height = Math.max(40, rightPaddle.height - 15);
        leftPaddle.height = Math.min(200, leftPaddle.height + 15);

        if (leftPaddle.score >= maxScore) {
            gameState = 'gameover';
            canvas.style.display = 'none';
            scoreDisplay.style.display = 'none';
            scrGameOver.style.display = 'flex';
            winnerText.innerText = 'ЛЕВЫЙ ВЫИГРАЛ!';
            playVictoryMarch(currentSfxVol);
        } else {
            resetBall();
        }
    }
}

function draw() {
    if (gameState !== 'playing') return;

    context.fillStyle = '#050505';
    context.fillRect(0, 0, canvas.width, canvas.height);

    context.strokeStyle = 'rgba(0, 255, 255, 0.15)';
    context.lineWidth = 4;
    context.beginPath();
    context.moveTo(canvas.width / 2, 0);
    context.lineTo(canvas.width / 2, canvas.height);
    context.stroke();

    context.fillStyle = paddle1Color;
    context.fillRect(leftPaddle.x, leftPaddle.y, paddleWidth, leftPaddle.height);

    context.fillStyle = paddle2Color;
    context.fillRect(rightPaddle.x, rightPaddle.y, paddleWidth, rightPaddle.height);

    context.fillStyle = '#fff';
    context.fillRect(ball.x - ballRadius, ball.y - ballRadius, ballRadius * 2, ballRadius * 2);
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
